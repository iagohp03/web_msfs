<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de PDFs - MSFS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f6f9; color: #333; overflow: hidden; }
        
        /* Menú Lateral */
        #sidebar { width: 320px; background: #1e272e; color: #fff; padding: 20px; overflow-y: auto; height: 100vh; flex-shrink: 0; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        #sidebar h2 { font-size: 1.3rem; margin-bottom: 20px; border-bottom: 2px solid #34495e; padding-bottom: 10px; color: #05c46b; text-transform: uppercase; letter-spacing: 1px; }
        .categoria { margin-bottom: 12px; background: #2d3748; border-radius: 6px; overflow: hidden; }
        .categoria-titulo { font-weight: 600; cursor: pointer; color: #fff; padding: 12px 15px; display: block; transition: background 0.2s; user-select: none; }
        .categoria-titulo:hover { background: #3f4e65; }
        .lista-archivos { list-style: none; padding: 5px 0; display: none; background: #232c3d; border-top: 1px solid #1e272e; }
        .lista-archivos.activo { display: block; }
        .lista-archivos li { margin: 2px 0; }
        .lista-archivos a { color: #dcdde1; text-decoration: none; font-size: 0.9rem; cursor: pointer; display: block; padding: 8px 20px; transition: all 0.2s; }
        .lista-archivos a:hover { color: #05c46b; background: #1e272e; padding-left: 25px; }

        /* Contenedor Principal (Visor) */
        #viewer-container { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; background: #57606f; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        .no-pdf { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; font-size: 1.2rem; color: #f5f6fa; text-align: center; padding: 20px; }
        .no-pdf span { font-size: 3rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Categorías MSFS</h2>
        <div id="menu-contenido">Cargando carpetas...</div>
    </div>

    <div id="viewer-container">
        <div id="placeholder" class="no-pdf">
            <span>✈️</span>
            Selecciona un archivo PDF del menú para visualizarlo aquí
        </div>
        <iframe id="pdf-viewer" style="display: none;"></iframe>
    </div>

    <script>
        const USUARIO = "iagohp03";
        const REPO = "msfs";
        
        const BASE_API_URL = `https://api.github.com/repos/${USUARIO}/${REPO}/contents`;

        async function cargarMenu() {
            try {
                const respuesta = await fetch(BASE_API_URL);
                const items = await respuesta.json();
                const menuContenedor = document.getElementById('menu-contenido');
                menuContenedor.innerHTML = '';

                const carpetas = items.filter(item => item.type === 'dir');

                if (carpetas.length === 0) {
                    menuContenedor.innerHTML = 'No se encontraron carpetas en la raíz.';
                    return;
                }

                for (const carpeta of carpetas) {
                    const catDiv = document.createElement('div');
                    catDiv.className = 'categoria';

                    const titulo = document.createElement('span');
                    titulo.className = 'categoria-titulo';
                    titulo.innerText = `📁 ${carpeta.name}`;
                    
                    const listaArchivos = document.createElement('ul');
                    listaArchivos.className = 'lista-archivos';

                    titulo.onclick = async () => {
                        listaArchivos.classList.toggle('activo');
                        
                        if (listaArchivos.children.length === 0) {
                            listaArchivos.innerHTML = '<li style="padding: 8px 20px; color: #aaa;">Cargando archivos...</li>';
                            await cargarArchivosDeCarpeta(carpeta.path, listaArchivos);
                        }
                    };

                    catDiv.appendChild(titulo);
                    catDiv.appendChild(listaArchivos);
                    menuContenedor.appendChild(catDiv);
                }
            } catch (error) {
                console.error("Error al cargar el repositorio:", error);
                document.getElementById('menu-contenido').innerText = 'Error al conectar con GitHub.';
            }
        }

        async function cargarArchivosDeCarpeta(path, ulElement) {
            try {
                const respuesta = await fetch(`${BASE_API_URL}/${path}`);
                const archivos = await respuesta.json();
                ulElement.innerHTML = '';

                const pdfs = archivos.filter(archivo => archivo.type === 'file' && archivo.name.toLowerCase().endsWith('.pdf'));

                if (pdfs.length === 0) {
                    ulElement.innerHTML = '<li style="padding: 8px 20px; color: #888; font-style: italic;">No hay PDFs en esta carpeta</li>';
                    return;
                }

                pdfs.forEach(pdf => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.innerText = `📄 ${pdf.name.replace(/\.[^/.]+$/, "")}`;
                    
                    const urlRaw = `https://raw.githubusercontent.com/${USUARIO}/${REPO}/main/${encodeURIComponent(pdf.path)}`;
                    
                    link.onclick = () => verPDF(urlRaw);

                    li.appendChild(link);
                    ulElement.appendChild(li);
                });
            } catch (error) {
                ulElement.innerHTML = '<li style="padding: 8px 20px; color: #ff4d4d;">Error al cargar</li>';
            }
        }

        function verPDF(url) {
            document.getElementById('placeholder').style.display = 'none';
            const viewer = document.getElementById('pdf-viewer');
            viewer.style.display = 'block';
            
            // Usamos el visor integrado de Google Docs para forzar la visualización online del PDF
            viewer.src = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`;
        }

        cargarMenu();
    </script>
</body>
</html>
