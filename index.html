<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSFS Flight Log</title>
    <style>
        /* --- ESTÉTICA DE AVIACIÓN / MODO OSCURO (GLASS COCKPIT) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19; /* Gris oscuro aeronáutico */
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- BARRA SUPERIOR (CABECERA) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid #1e293b;
            background-color: #0f172a; /* Color panel principal */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #38bdf8; /* Azul aviónica */
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .search-container {
            position: relative;
        }
        .search-input {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 8px 12px;
            padding-left: 36px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            width: 220px;
            transition: all 0.25s ease;
        }
        .search-input:focus {
            border-color: #00e5ff; /* Brillo radar */
            width: 280px;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.85rem;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- MENÚ LATERAL (CATEGORÍAS Y RUTAS) --- */
        aside {
            width: 320px;
            border-right: 1px solid #1e293b;
            background-color: #0f172a;
            overflow-y: auto;
            padding: 20px;
        }
        .zona-container {
            margin-bottom: 12px;
            background-color: #1e293b;
            border-radius: 6px;
            border: 1px solid #334155;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .zona-container:hover {
            border-color: #475569;
        }
        .zona-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            font-weight: 700;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            background-color: #131c2e;
        }
        .zona-header::after {
            content: '▲';
            font-size: 0.65rem;
            color: #64748b;
            transition: transform 0.2s ease;
        }
        .zona-container.collapsed .zona-header::after {
            transform: rotate(180deg);
        }
        .rutas-list {
            list-style: none;
            padding: 6px;
            display: block;
            background-color: #1e293b;
        }
        .zona-container.collapsed .rutas-list {
            display: none;
        }
        .ruta-item {
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: Consolas, Monaco, monospace; /* Toque técnico de coordenadas */
            color: #cbd5e1;
            transition: all 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ruta-item:hover {
            background-color: #273549;
            color: #f8fafc;
            padding-left: 16px;
        }
        .ruta-item.active {
            background-color: #00e5ff; /* Color HUD activo */
            color: #0b0f19;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .empty-message {
            font-size: 0.8rem;
            color: #64748b;
            font-style: italic;
            padding: 10px 12px;
        }

        /* --- PANEL DEL VISOR DE PDF --- */
        main {
            flex: 1;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 15px;
        }
        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .status-message {
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
            padding: 25px;
            border: 1px dashed #1e293b;
            border-radius: 8px;
            background-color: #0f172a;
            max-width: 400px;
        }

        /* --- RESPONSIVE PARA DISPOSITIVOS MÓVILES --- */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            aside {
                width: 100%;
                height: 45vh;
                border-right: none;
                border-bottom: 1px solid #1e293b;
            }
            main {
                height: 55vh;
                padding: 5px;
            }
            .search-input:focus {
                width: 200px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>MSFS Flight Log</h1>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-box" class="search-input" placeholder="Buscar ruta (ej: LEMD)...">
        </div>
    </header>

    <div class="main-container">
        
        <aside id="sidebar">
            <div class="status-message">Conectando con tu hangar en GitHub...</div>
        </aside>

        <main>
            <div class="status-message" id="welcome-message">
                Selecciona una ruta del menú para ver el plan de vuelo.
            </div>
            <iframe class="pdf-viewer" id="pdf-frame" src=""></iframe>
        </main>

    </div>

    <script>
        const USERNAME = 'iagohp03';
        const REPO = 'msfs';
        const TOKEN = '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';

        const sidebar = document.getElementById('sidebar');
        const pdfFrame = document.getElementById('pdf-frame');
        const welcomeMessage = document.getElementById('welcome-message');
        const searchBox = document.getElementById('search-box');

        let todoElHangar = {}; 

        const headers = {
            'Authorization': `Bearer ${TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
        };

        async function cargarHangar() {
            try {
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents`, { headers });
                if (!response.ok) throw new Error('No se pudo acceder al repositorio');
                
                const elementos = await response.json();
                const carpetas = elementos.filter(el => el.type === 'dir');

                if (carpetas.length === 0) {
                    sidebar.innerHTML = '<div class="status-message">No se encontraron carpetas en tu repositorio.</div>';
                    return;
                }

                sidebar.innerHTML = ''; 

                for (const carpeta of carpetas) {
                    const resCarpeta = await fetch(carpeta.url, { headers });
                    if (resCarpeta.ok) {
                        const archivos = await resCarpeta.json();
                        const pdfs = archivos.filter(arch => arch.name.toLowerCase().endsWith('.pdf'));
                        todoElHangar[carpeta.name] = pdfs;
                    }
                }

                renderizarInterfaz(todoElHangar, false);

            } catch (error) {
                console.error(error);
                sidebar.innerHTML = '<div class="status-message" style="color: #ef4444;">Error al conectar con GitHub. Revisa la consola (F12).</div>';
            }
        }

        function renderizarInterfaz(datosMostrar, isSearching = false) {
            sidebar.innerHTML = '';
            
            for (const [zona, pdfs] of Object.entries(datosMostrar)) {
                const zonaContainer = document.createElement('div');
                zonaContainer.className = 'zona-container';
                
                if (!isSearching) {
                    zonaContainer.classList.add('collapsed');
                }

                const headerZona = document.createElement('div');
                headerZona.className = 'zona-header';
                headerZona.textContent = zona;
                
                headerZona.addEventListener('click', () => {
                    zonaContainer.classList.toggle('collapsed');
                });
                
                zonaContainer.appendChild(headerZona);

                const listaUls = document.createElement('ul');
                listaUls.className = 'rutas-list';

                if (pdfs.length === 0) {
                    const itemVacio = document.createElement('li');
                    itemVacio.className = 'empty-message';
                    itemVacio.textContent = 'No hay rutas en esta zona';
                    listaUls.appendChild(itemVacio);
                } else {
                    pdfs.forEach(pdf => {
                        const itemLi = document.createElement('li');
                        itemLi.className = 'ruta-item';
                        itemLi.textContent = pdf.name.replace(/\.[^/.]+$/, ""); 
                        
                        itemLi.addEventListener('click', async (e) => {
                            e.stopPropagation(); 
                            document.querySelectorAll('.ruta-item').forEach(el => el.classList.remove('active'));
                            itemLi.classList.add('active');
                            
                            welcomeMessage.style.display = 'block';
                            welcomeMessage.textContent = 'Cargando plano de vuelo...';
                            pdfFrame.style.display = 'none';

                            try {
                                const resBlob = await fetch(pdf.url, { headers });
                                if (!resBlob.ok) throw new Error('Error al descargar el PDF');
                                
                                const datosJson = await resBlob.json();
                                const respuestaContenido = await fetch(`data:application/pdf;base64,${datosJson.content}`);
                                const blobPdf = await respuestaContenido.blob();
                                
                                const urlLocal = URL.createObjectURL(blobPdf);
                                
                                welcomeMessage.style.display = 'none';
                                pdfFrame.style.display = 'block';
                                pdfFrame.src = urlLocal;

                            } catch (error) {
                                console.error(error);
                                welcomeMessage.textContent = 'Error al renderizar el PDF nativo.';
                            }
                        });

                        listaUls.appendChild(itemLi);
                    });
                }

                zonaContainer.appendChild(listaUls);
                sidebar.appendChild(zonaContainer);
            }
        }

        // --- MOTOR DEL BUSCADOR ---
        searchBox.addEventListener('input', (e) => {
            const busqueda = e.target.value.toLowerCase().trim();

            if (busqueda === '') {
                renderizarInterfaz(todoElHangar, false);
                return;
            }

            let hangarFiltrado = {};

            for (const [zona, pdfs] of Object.entries(todoElHangar)) {
                const pdfsFiltrados = pdfs.filter(pdf => pdf.name.toLowerCase().includes(busqueda));
                if (pdfsFiltrados.length > 0) {
                    hangarFiltrado[zona] = pdfsFiltrados;
                }
            }

            renderizarInterfaz(hangarFiltrado, true);
        });

        cargarHangar();
    </script>
</body>
</html>
